# docker compose -f deploy/compose.yaml up --build
# then open the Admin UI at http://localhost:3002 (no sign in; it listens on localhost only) and use
# "Try sign in" on any application, or open the demo client at http://localhost:3001.
#
# One container, every process (ADR 0023): hydra, faye, the Login UI and the Admin UI under
# s6-overlay, and with FAYE_DEMO=true the demo's ip-reputation stub, bootstrap, seed and demo
# client. The same image runs a subset (FAYE_SERVICES, e.g. faye,login,admin without hydra) or
# one process per container.
#
# The generated account passwords and application secrets stay inside the volume, out of
# Faye's reach; to read them:
#   docker exec faye cat /var/lib/faye/demo/users.csv /var/lib/faye/demo/clients.jsonl
# Faye serves its admin API only on a Unix domain socket inside the container,
# /run/faye/admin.sock, which only the Admin UI's group can open (ADR 0028); :8080 answers 404
# there. The admin API token, checked on the socket too, is generated on first boot (or set
# with FAYE_ADMIN_TOKEN):
#   docker exec faye cat /var/lib/faye/secrets/admin-token
name: faye

services:
  faye:
    build:
      context: ..
      dockerfile: Dockerfile
    image: faye
    container_name: faye
    environment:
      FAYE_DEMO: "true"
    # faye.db (ADR 0017: Hydra's tables and Faye's), secrets/ and demo/ (ADR 0019)
    volumes: ["data:/var/lib/faye"]
    # Hydra's admin API (4445) and the ip-reputation stub (8000) are loopback only inside
    # the container and never published; the Admin UI is loopback on the host too
    ports: ["4444:4444", "8080:8080", "3000:3000", "3001:3001", "127.0.0.1:3002:3002"]

volumes:
  data:
