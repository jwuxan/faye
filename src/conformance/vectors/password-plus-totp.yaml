name: password then a picked second factor, retrying a wrong code
ir: flows/passkey-totp.json
handlers:
  identity.resolve: [{ ok: { user: { identified_by: identifier, has_passkey: true, has_totp: true } } }]
  password.verify: [ok]
  totp.verify: [{ fail: invalid_code }, ok]
events:
  - expect_screen: identifier
  - submit: { identifier: alice@example.com }
  - expect_screen: password
  - submit: { password: right }
  - expect_screen: method_picker
    expect_step: second-factor
    expect_options: [totp, passkey]
  - submit: { method: totp }
  - expect_screen: otp
  - submit: { code: "000000" }
  - expect_screen: otp
    expect_error: invalid_code
    expect_attempts_left: 2
  - submit: { code: "123456" }
  - expect_result: { succeed: true, subject: alice, amr: [pwd, otp], acr: "faye:2fa" }
