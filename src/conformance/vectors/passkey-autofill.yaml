name: a passkey from identifier autofill answers the passkey screen and signs in with two factors
ir: flows/passkey-totp.json
handlers:
  identity.resolve: [{ ok: { user: { identified_by: passkey, has_passkey: true, has_totp: true } } }]
  webauthn.assert: [ok]
events:
  - expect_screen: identifier
    expect_passkey: true
  - submit: { passkey: { id: credential-1, type: public-key } }
  - expect_result: { succeed: true, subject: alice, amr: [hwk, user], acr: "faye:2fa" }
