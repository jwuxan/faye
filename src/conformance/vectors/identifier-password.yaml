name: the identifier screen asks for the password too, and one answer resolves and verifies
ir: flows/identifier-password.json
handlers:
  identity.resolve: [ok]
  password.verify: [ok]
events:
  - expect_screen: identifier
    expect_step: identify
    expect_path: /login
    expect_password: true
  - submit: { identifier: alice@example.com, password: hunter2 }
  - expect_result: { succeed: true, subject: alice, amr: [pwd], acr: "faye:1fa" }
