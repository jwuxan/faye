name: with phone codes on, the person picks a texted code; a password and a texted code are two factors (ADR 0032)
ir: flows/delivered-codes.json
handlers:
  identity.resolve: [{ ok: { user: { has_totp: false, has_phone: true, email_verified: true } } }]
  password.verify: [ok]
  sms_code.verify: [ok]
events:
  - expect_screen: identifier
  - submit: { identifier: alice@example.com }
  - expect_screen: password
  - submit: { password: right }
  - expect_screen: method_picker
    expect_options: [phone, email]
  - submit: { method: phone }
  - expect_screen: code_sent
    expect_channel: sms
  - submit: { code: "123456" }
  - expect_result: { succeed: true, subject: alice, amr: [pwd, sms], acr: "faye:2fa" }
