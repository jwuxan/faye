name: identifier then password succeeds with amr pwd
ir: flows/default-login.json
handlers:
  identity.resolve: [ok]
  password.verify: [ok]
events:
  - expect_screen: identifier
    expect_step: identify
  - submit: { identifier: alice@example.com }
  - expect_screen: password
    expect_step: credential
  - submit: { password: right }
  - expect_result: { succeed: true, subject: alice, amr: [pwd] }
expect_failure: none
