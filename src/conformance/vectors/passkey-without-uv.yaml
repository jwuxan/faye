name: a passkey without user verification proves only possession, and TOTP adds no second factor class
ir: flows/passkey-totp.json
handlers:
  identity.resolve: [{ ok: { user: { identified_by: passkey, has_passkey: true, has_totp: true } } }]
  webauthn.assert: [{ ok: { amr: [hwk] } }]
  totp.verify: [ok]
events:
  - expect_screen: identifier
  - submit: { passkey: { id: credential-1, type: public-key } }
  - expect_screen: otp
    expect_step: second-factor
  - submit: { code: "123456" }
  - expect_result: { succeed: true, subject: alice, amr: [hwk, otp], acr: "faye:1fa" }
