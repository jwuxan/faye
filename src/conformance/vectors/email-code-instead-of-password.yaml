name: an emailed code may stand in for the password; an app's code follows it as the second factor (ADR 0032)
ir: flows/code-first.json
handlers:
  identity.resolve: [{ ok: { user: { email_verified: true, has_phone: false, has_totp: true } } }]
  email_code.verify: [ok]
  totp.verify: [ok]
events:
  - expect_screen: identifier
  - submit: { identifier: alice@example.com }
  - expect_screen: method_picker
    expect_options: [password, email]
  - submit: { method: email }
  - expect_screen: code_sent
    expect_channel: email
  - submit: { code: "123456" }
  - expect_screen: otp
  - submit: { code: "654321" }
  - expect_result: { succeed: true, subject: alice, amr: [email, otp], acr: "faye:1fa" }
