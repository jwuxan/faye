name: an offered remember that is not a boolean is refused, and the flow still waits on the screen (ADR 0033)
ir: flows/identifier-password.json
tenant: { remember_me: true }
handlers:
  identity.resolve: [ok]
  password.verify: [ok]
events:
  - expect_screen: identifier
    expect_remember: true
  - submit: { identifier: alice@example.com, password: hunter2, remember: "yes" }
  - expect_refused: invalid_submission
  - submit: { identifier: alice@example.com, password: hunter2, remember: true }
  - expect_result: { succeed: true, subject: alice, amr: [pwd], acr: "faye:1fa", remember: true }
