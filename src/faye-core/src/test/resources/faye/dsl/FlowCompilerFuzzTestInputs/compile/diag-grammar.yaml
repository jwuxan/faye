flow: f
version: 1
login:
  steps:
    a:
      if: { xor: [user.a] }
      retry: 0
      use: password.verify
    b:
      alternative: {}
    c:
      screen: { type: Password }
      set: { Risk: 1.5 }
    d:
      if: secrets.key
      fail: no way

