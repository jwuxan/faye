# The block contract (ADR 0030): the blocks a flow's steps may be, by id. faye-identity's IdentityBlock
# implements exactly these (faye-app BlocksTest), and the Admin UI's palette offers exactly these
# (web/apps/admin/lib/flow.test.ts). Keys:
#   title     how diagnostics and the console name it
#   handler   the handler its step calls
#   screen    the screen its step shows
#   role      identifier | password | credential | action | consent: where it may go
#   fixed     screen options it always sets
#   settings  what a flow may change under `with`, with its default, and what it changes:
#             option (a screen option of that name), password (the identifier's password view),
#             attempts (how many times the step runs)
identifier:
  title: Identifier
  handler: identity.resolve
  screen: identifier
  role: identifier
  settings:
    passkey: { default: false, target: option }
    password: { default: false, target: password }
    attempts: { default: 3, target: attempts }
password:
  title: Password
  handler: password.verify
  screen: password
  role: password
  settings: { attempts: { default: 3, target: attempts } }
passkey:
  title: Passkey
  handler: webauthn.assert
  screen: passkey
  role: credential
  settings: { attempts: { default: 1, target: attempts } }
add-passkey:
  title: Add passkey
  handler: webauthn.register
  screen: passkey
  role: action
  fixed: { register: true }
totp:
  title: TOTP
  handler: totp.verify
  screen: otp
  role: credential
  settings: { attempts: { default: 3, target: attempts } }
enroll-totp:
  title: Enroll TOTP
  handler: totp.enroll
  screen: otp_enroll
  role: credential
  settings: { attempts: { default: 3, target: attempts } }
consent:
  title: Consent
  handler: consent.record
  screen: consent
  role: consent
