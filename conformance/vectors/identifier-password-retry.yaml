name: a wrong password shows the identifier screen again, and an answer without the password is refused
ir: flows/identifier-password.json
handlers:
  identity.resolve: [ok, ok]
  password.verify: [{ fail: invalid_credentials }, ok]
events:
  - expect_screen: identifier
    expect_password: true
  - submit: { identifier: alice@example.com }
  - expect_refused: invalid_submission
  - submit: { identifier: alice@example.com, password: wrong }
  - expect_screen: identifier
    expect_password: true
    expect_error: invalid_credentials
    expect_attempts_left: 2
  - submit: { identifier: alice@example.com, password: right }
  - expect_result: { succeed: true, subject: alice, amr: [pwd], acr: "faye:1fa" }
