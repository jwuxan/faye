name: remember is an answer only where the screen offers it, and only a boolean (ADR 0033)
ir: flows/identifier-password.json
handlers:
  identity.resolve: [ok]
  password.verify: [ok]
events:
  - expect_screen: identifier
    expect_remember: false
  # Not offered: the field is not part of the answer, so the answer is malformed
  - submit: { identifier: alice@example.com, password: hunter2, remember: true }
  - expect_refused: invalid_submission
  - submit: { identifier: alice@example.com, password: hunter2 }
  - expect_result: { succeed: true, subject: alice, amr: [pwd], acr: "faye:1fa" }
