name: a preview flow sees the scenario's request overrides; a hook in a step is traced with its outcome
ir: flows/password-only.json
host:
  client: { client_id: preview-risk, metadata: { preview: true } }
preview:
  draft: flows/risk-hook.json
  request: { ip: 203.0.113.7 }
handlers:
  identity.resolve: [ok]
  password.verify: [ok]
  totp.verify: [ok]
hooks:
  risk: [{ returns: { set: { risk: high } }, expect_request: { ip: 203.0.113.7 } }]
events:
  - expect_screen: identifier
  - submit: { identifier: alice@example.com }
  - expect_screen: password
  - submit: { password: right }
  - expect_screen: otp
  - submit: { code: "123456" }
  - expect_result: { succeed: true, subject: alice, amr: [pwd, otp], acr: "faye:2fa" }
expect_trace:
  - start login
  - step identify
  - screen identifier
  - call identity.resolve ok
  - step risk
  - hook risk ok
  - step credential
  - screen password
  - call password.verify ok pwd
  - step second-factor
  - screen otp
  - call totp.verify ok otp
  - end succeed pwd+otp faye:2fa
