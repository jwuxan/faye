name: a preview client's consent runs the draft and is traced; the host, not the engine, turns the outcome into claims
ir: flows/password-only.json
host:
  kind: consent
  client: { client_id: preview-partner, first_party: false, metadata: { preview: true } }
  params: { subject: alice, requested_scope: [openid], context: { flowId: f_login } }
preview:
  draft: flows/partner-consent.json
handlers:
  consent.record: [ok]
events:
  - expect_screen: consent
    expect_step: grant
  - submit: { decision: allow }
  - expect_result: { succeed: true, subject: alice, grant_scope: [openid], user: {} }
expect_trace:
  - start consent
  - step grant
  - screen consent
  - call consent.record ok
  - end succeed
