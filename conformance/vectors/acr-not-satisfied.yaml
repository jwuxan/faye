name: a client asking for faye:2fa is refused by a flow that only proves a password
ir: flows/password-only.json
host:
  hydra: { acr_values: ["faye:2fa"] }
handlers:
  identity.resolve: [ok]
  password.verify: [ok]
events:
  - expect_screen: identifier
  - submit: { identifier: alice@example.com }
  - expect_screen: password
  - submit: { password: right }
  - expect_result: { succeed: false, reason: acr_not_satisfied }
