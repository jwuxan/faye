name: 'a hook result outside set, fail, pick and {} is a hook error: set-nested-auth'
ir: flows/risk-hook.json
handlers:
  identity.resolve: [ok]
hooks:
  risk: [{ returns: { set: { auth: { subject: mallory, amr: [pwd] } } } }]
events:
  - expect_screen: identifier
  - submit: { identifier: alice@example.com }
  - expect_result: { succeed: false, reason: hook_error }
