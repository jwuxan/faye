name: amr lists each class once
ir: flows/two-credentials.json
handlers:
  identity.resolve: [ok]
  password.verify: [ok, ok]
events:
  - expect_screen: identifier
  - submit: { identifier: alice@example.com }
  - expect_screen: password
    expect_step: first
  - submit: { password: one }
  - expect_screen: password
    expect_step: second
  - submit: { password: two }
  - expect_result: { succeed: true, subject: alice, amr: [pwd] }
