name: only integers order and a fractional number equals no integer (7.5 is not greater than 5 as an integer; 3.0 is not 3) (ADR 0007, seed finding 2)
ir: flows/numbers.json
host:
  client: { client_id: demo, metadata: { score: 7.5, level: 3.0 } }
handlers:
  identity.resolve: [ok]
  password.verify: [ok]
events:
  - expect_screen: identifier
  - submit: { identifier: alice@example.com }
  - expect_screen: password
  - submit: { password: right }
  - expect_result: { succeed: true, subject: alice, amr: [pwd], acr: "faye:1fa" }
