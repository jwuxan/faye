name: acr_values faye:2fa makes an account without a second factor enroll TOTP, then offers a passkey
ir: flows/passkey-totp.json
host:
  hydra: { acr_values: ["faye:2fa"] }
handlers:
  identity.resolve: [{ ok: { user: { identified_by: identifier, has_passkey: false, has_totp: false } } }]
  password.verify: [ok]
  totp.enroll: [{ ok: { user: { has_totp: true } } }]
  webauthn.register: [ok]
events:
  - expect_screen: identifier
  - submit: { identifier: bob@example.com }
  - expect_screen: password
  - submit: { password: right }
  - expect_screen: otp_enroll
    expect_step: second-factor
  - submit: { code: "123456" }
  - expect_screen: passkey
    expect_step: add-passkey
  - submit: { skip: true }
  - expect_result: { succeed: true, subject: alice, amr: [pwd, otp], acr: "faye:2fa" }
