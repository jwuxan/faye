name: a production client's ID token claims never carry the flow id
ir: flows/partner-consent.json
host:
  kind: consent
  client: { client_id: partner-app, first_party: false }
  params: { subject: alice, requested_scope: [openid], context: { flowId: f_login } }
handlers:
  consent.record: [ok]
events:
  - expect_screen: consent
  - submit: { decision: allow }
  - expect_result: { succeed: true, subject: alice, grant_scope: [openid], id_token: {} }
