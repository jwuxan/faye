name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
        env:
          FAYE_REQUIRE_REDIS: "1"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated contract types match schema/screen.schema.json
        run: pnpm generate && git diff --exit-code -- packages/contract/src
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # M2 to M5 checks: the compose stack signs in through every demo tenant and the Admin UI (deploy/smoke.sh).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose.yaml up -d --build
      - name: Wait for the stack and the demo client registrations
        run: |
          for i in $(seq 1 120); do
            # faye-admin is the last client bootstrap registers; Faye and the Login UI only need to accept connections.
            if curl -fs -o /dev/null http://localhost:4445/admin/clients/faye-admin \
              && curl -fs -o /dev/null http://localhost:3001 \
              && curl -fs -o /dev/null http://localhost:3002 \
              && curl -s -o /dev/null http://localhost:8080 \
              && curl -s -o /dev/null http://localhost:3000; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: deploy/smoke.sh
      - if: failure()
        run: docker compose -f deploy/compose.yaml logs
