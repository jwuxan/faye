name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  src:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build publishToMavenLocal
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-src
          path: src/*/build/reports/jacoco/test/html

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated contract (screen types, IR grammar facts) matches schema/
        run: pnpm generate && git diff --exit-code -- packages/contract/src
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # Browser tests of the Login UI (ADR 0033): the build above against a stub of Faye's screen
      # API, in the Chromium build this Playwright version pins, with its system libraries
      - name: Install Chromium for the Login UI's browser tests
        working-directory: apps/web/apps/login
        run: PLAYWRIGHT_BROWSERS_PATH="$PWD/.playwright" pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-e2e-traces
          path: apps/web/apps/login/test-results/
          if-no-files-found: ignore

  # M2 to M6 checks: the compose stack signs in through every tenant and application and the Admin UI (deploy/smoke.sh).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose.yaml up -d --build
      - name: Wait for the stack and the client registrations
        run: |
          for i in $(seq 1 180); do
            # Bank Investments is the last client bootstrap registers. Hydra's admin API is not
            # published (ADR 0022), so read it inside the container.
            # The seed writes the accounts smoke.sh signs in with once Faye has migrated, so wait
            # for its file too.
            if docker exec faye wget -qO- 'http://127.0.0.1:4445/admin/clients?client_name=Bank%20Investments' | grep -q client_id \
              && docker exec faye test -s /var/lib/faye/demo/users.csv \
              && curl -fs -o /dev/null http://localhost:3001 \
              && curl -fs -o /dev/null http://localhost:3002 \
              && curl -s -o /dev/null http://localhost:8080 \
              && curl -s -o /dev/null http://localhost:3000; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: deploy/smoke.sh
      - name: Hydra's admin API is not published
        run: |
          curl -fs -m 5 -o /dev/null http://localhost:4445/health/ready && exit 1 || exit 0
      - if: failure()
        run: docker logs faye
