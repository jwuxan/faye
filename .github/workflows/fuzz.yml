name: fuzz

# Coverage guided fuzzing (ADR 0007). Every ./gradlew build in ci.yml already replays the stored
# inputs (T0); this searches for new ones: briefly on each pull request that touches the server
# (T1), for longer every night (T2). The corpus is kept in the Actions cache, never committed, and
# a finding's input is never uploaded: it is a security bug until triaged.
on:
  pull_request:
    paths: ["src/**", "apps/server/**", "deploy/fuzz.sh", ".github/workflows/fuzz.yml"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: Time per harness
        default: 10m

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        harness:
          - IrCodecFuzzTest
          - SourceMapFuzzTest
          - FlowCompilerFuzzTest
          - PredicatesFuzzTest.predicates
          - PredicatesFuzzTest.acr
          - StoredStateFuzzTest
          - EngineFuzzTest
          - BuiltinHandlersFuzzTest
          - TotpFuzzTest.base32
          - TotpFuzzTest.totp
          - FlowApiFuzzTest
          - QrGrantsFuzzTest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Pull requests read the nightly corpus but never write it
      - uses: actions/cache/restore@v4
        if: github.event_name == 'pull_request'
        with:
          path: |
            src/*/.cifuzz-corpus
            apps/server/*/.cifuzz-corpus
          key: fuzz-corpus-${{ matrix.harness }}-
          restore-keys: fuzz-corpus-${{ matrix.harness }}-
      - uses: actions/cache@v4
        if: github.event_name != 'pull_request'
        with:
          path: |
            src/*/.cifuzz-corpus
            apps/server/*/.cifuzz-corpus
          key: fuzz-corpus-${{ matrix.harness }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.harness }}-
      - name: Fuzz
        run: deploy/fuzz.sh "${{ github.event_name == 'pull_request' && '2m' || inputs.duration || '30m' }}" "${{ matrix.harness }}"
