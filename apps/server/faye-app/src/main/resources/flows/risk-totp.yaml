# Password, plus a second factor when a risk hook scores the sign in as high risk.
#
# The risk hook asks the ip-reputation service (a named egress target the tenant grants) about the
# request and sets vars.risk. A hook can only set vars, fail, or pick; it cannot sign anyone in, so
# the checker still sees a password on every path and TOTP on the high risk ones.
flow: risk-totp
version: 1

hooks:
  risk:
    file: risk.js
    capabilities: { http: [ip-reputation] }
    timeout_ms: 500

login:
  steps:
    identify:
      block: identifier
      after: risk
    credential:
      block: password
    second-factor:
      if: { eq: [vars.risk, high] }
      alternative:
        totp:
          if: user.has_totp
          block: totp
        enroll:
          if: { not: user.has_totp }
          block: enroll-totp
