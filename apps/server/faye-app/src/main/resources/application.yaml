spring:
  # A body a browser posts is read strictly: repeated keys are refused, not resolved to the last one
  # (ADR 0007, security standard 1)
  jackson:
    parser:
      strict-duplicate-detection: true
  application:
    name: faye
  # One SQLite database holds every store: flows, versions, hooks, settings, traces and each tenant's
  # user pool. In the compose stack Hydra keeps its tables in the same file (ADR 0017). Flyway
  # migrates it at startup from db/migration (ADR 0020).
  datasource:
    url: jdbc:sqlite:${FAYE_DATABASE:faye.db}?journal_mode=WAL&busy_timeout=10000&transaction_mode=IMMEDIATE
    driver-class-name: org.sqlite.JDBC
  flyway:
    # Faye's history table carries Faye's prefix beside Hydra's tables
    table: faye_schema_history
    # A database that already has tables (Hydra's, or Faye's from before migrations) baselines at 0,
    # then V1 and later run
    baseline-on-migrate: true
    baseline-version: 0
    # clean would drop Hydra's tables in the shared database
    clean-disabled: true

faye:
  login-ui-url: ${FAYE_LOGIN_UI_URL:http://localhost:3000}
  hydra-admin-url: ${FAYE_HYDRA_ADMIN_URL:}
  # How long the store keeps a suspended flow, from its start; set to Hydra's challenge lifetime. Tenants
  # may set shorter limits per entry kind in their flow settings, never longer (ADR 0035)
  flow-ttl: 30m
  # Unset, the admin API (drafts, validate, publish, roll back, settings) is off
  admin-token: ${FAYE_ADMIN_TOKEN:}
  # The admin API is served over HTTP on this Unix domain socket, and never on the TCP port. Unset,
  # the admin API is off (ADR 0028)
  admin-socket: ${FAYE_ADMIN_SOCKET:}
  # On, clients registered with metadata.preview = true run their tenant's draft once it passes the
  # checker, and are traced for the Admin UI. Off, their sign ins are refused.
  preview-enabled: ${FAYE_PREVIEW_ENABLED:false}
  # Base64, at least 32 bytes: the key one time codes Faye delivers are MACed with (ADR 0032). Unset,
  # one is generated once and kept in the database
  code-key: ${FAYE_CODE_KEY:}
  # Codes for any tenant channel without a webhook are written here as files, not sent: the shipped
  # tenants' delivery, since Acme's flow sends codes (ADR 0032). Empty, such a channel is off and flows
  # naming its blocks are refused at publish
  demo-outbox: ${FAYE_DEMO_OUTBOX:build/outbox}
  # Each tenant's flow is checked against its settings, then published at startup. Settings saved
  # through the admin API override these, except egress.
  tenants:
    # Acme's applications: a password, an emailed or texted code, or a QR code approved on a phone;
    # a second factor when the risk hook scores a sign in high; consent for third party applications
    acme:
      name: Acme
      flow: classpath:flows/acme.yaml
      # Hooks of this tenant may call these named targets, and no others
      egress: [ip-reputation]
    # Bank's applications: passkey, or password plus a second factor, consent for third party
    # applications
    bank:
      name: Bank
      flow: classpath:flows/passkey-totp.yaml
      # Where emailed and texted codes go (ADR 0032): an operator's endpoint that hands each code to
      # their provider, signed with the secret (header Faye-Signature). Unset, the demo outbox is used
      # when there is one, else the channel is off.
      # delivery:
      #   email: { url: https://mail-relay.example/faye, secret: "${FAYE_BANK_EMAIL_SECRET}" }
      #   sms: { url: https://sms-relay.example/faye, secret: "${FAYE_BANK_SMS_SECRET}", per-hour: 100 }
  # Named HTTP targets for hooks. Unset, the risk hook cannot reach its service and scores high.
  egress:
    ip-reputation: ${FAYE_IP_REPUTATION_URL:}
  webauthn:
    rp-id: ${FAYE_WEBAUTHN_RP_ID:localhost}
    origins: ${FAYE_WEBAUTHN_ORIGINS:http://localhost:3000}
  # No accounts here: each tenant's user pool is in the database, written by deploy/directory/seed.mjs
  demo-users: []
