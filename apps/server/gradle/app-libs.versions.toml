# The application's catalog: Spring Boot and the host/credential libraries only it may use.
# Everything shared with the product comes from the product's catalog (libs).
[versions]
spring-boot = "3.5.16"
webauthn4j = "0.30.3.RELEASE"
bouncycastle = "1.82"
jetbrains-annotations = "26.0.2"
sqlite-jdbc = "3.53.4.0"
hydra-client = "2.2.0"
jakarta-annotation = "2.1.1"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto" }
# the commons-logging API spring-security-crypto logs through
spring-jcl = { module = "org.springframework:spring-jcl" }
# Versioned schema migrations, Boot managed (ADR 0020)
flyway-core = { module = "org.flywaydb:flyway-core" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
webauthn4j-core = { module = "com.webauthn4j:webauthn4j-core", version.ref = "webauthn4j" }
webauthn4j-test = { module = "com.webauthn4j:webauthn4j-test", version.ref = "webauthn4j" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
# Ory's generated admin client, matching the pinned Hydra (ADR 0021)
hydra-client = { module = "sh.ory.hydra:hydra-client", version.ref = "hydra-client" }
# The generated classes carry these annotations; javac needs them to read the classes (compile only)
jakarta-annotation-api = { module = "jakarta.annotation:jakarta.annotation-api", version.ref = "jakarta-annotation" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
